<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALVIO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>CALVIO</h1>
        <div class="display">
            <div id="previousNumber"></div>
            <div id="currentNumber"></div>
        </div>
        <div class="buttons">
            <button class="clear"data-action="clear">C</button>
            <button data-action="backspace">&#9003;</button>
            <button class="operator" data-operator="/">&divide;</button>
            <button class="operator" data-operator="*">&times;</button>
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">-</button>
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equal" data-action="calculate">=</button>
            <button class="zero"data-number="0">0</button>
            <button data-action="decimal">.</button>
        </div>
        <p class="hint">You can also use your keyboard</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
